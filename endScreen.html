<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: black; color: white; }
        #container { margin-top: 50px; }
        #winner { font-size: 24px; font-weight: bold; color: gold; }
        #rankings { margin-top: 20px; padding: 20px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="container">
        <h1>Game Over</h1>
        <p id="winner"></p>
        <div id="rankings"></div>
        <button onclick="restartGame()">Restart Game</button>
    </div>

    <script>
        // Get winner & rankings from URL
        const params = new URLSearchParams(window.location.search);
        const winner = params.get("winner");
        const rankings = JSON.parse(decodeURIComponent(params.get("rankings")));

        // Show winner
        document.getElementById("winner").textContent = `Winner: ${winner}`;

        // Show rankings
        document.getElementById("rankings").innerHTML = rankings.map((p, i) => 
            `<p>#${i + 1} ${p.name} (${p.territories} territories)</p>`
        ).join("");

        // Restart game
        function restartGame() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
