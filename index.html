<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisions</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115.0/build/three.min.js" integrity="sha256-BKLpj/JlS+Fk4HENt+eiU5TifNz5GsSAl3KpXe80Lxc=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115.0/examples/js/controls/OrbitControls.js" integrity="sha256-uWwPr5IvLCtUCrZZdAZubHpQZ+HFhOL4ZdoLKhodld0=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js" integrity="sha256-tHoAPGoNdhIR28YHl9DWLzeRfdwigkH7OCBXMrHXhoM=" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <script src="Country.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script defer src="peerConnect.js"></script>

    <style>
        body {
            margin: 0;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        .label {
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            background-color: rgba(255, 0, 0, 0.671);
            padding: 2px;
            border-radius: 3px;
            text-align: center;
        }

        .country_name {
            position: fixed;
            /* bottom: 5%; */
            bottom: 0;
            left: 2%;
            padding: 12px;
            font-size: 2.5rem;
            color: white;;
            user-select: none;
            text-shadow: -1px 1px 0 #000, 1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
            font-family: 'Roboto', sans-serif;
            /* visibility: hidden; */
        }

        /* Toggleable Action Panel */
        .territory_info_div {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            visibility: hidden;
            z-index: 1000; /* Makes sure it's on top of everything */
        }

        .territory_info_div button {
            background: #813b13ee;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .territory_info_div button:hover {
            background: #69391d;
        }

        /* Permanent HUD */
        .game_hud {
            position: fixed;
            /* bottom: 10px; */
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            background: rgba(30, 30, 30, 0.95);
            padding: 5px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            visibility: hidden;
            z-index: 1000; /* Makes sure it's on top of everything */
        }

        .hud-section {
            display: flex;
            justify-content: space-around;
            /* justify-content: center; */
            color: white;
        }

        .stat {
            text-align: center;
        }

        #stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        #stat-label {
            font-size: 14px;
        }

        /* .territory_info_div {
            position: fixed;
            bottom: 20%;
            left: 46.8%;
            font-size: 2rem;
            color: white;
            user-select: none;
            font-family: 'Roboto', sans-serif;
            border: solid;
            border-color: rgb(196, 2, 2);
            border-width: 5px;
            size: auto;
            display: inline-flex;
            pointer-events: auto;
            visibility: hidden;
            z-index: 1000;
        } */

        /* #attackButton, #sailButton {
            pointer-events: auto;
        } */

        /* Territory troop label */
        #troopContainer {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none; /* Prevent interaction */
            z-index: 10; /* Makes sure it's on top of the map but behind the HUD and actionPanel */
        }

        .troop-count {
            position: absolute;
            color: white;
            font-size: 15rem;
            font-weight: bold;
            text-shadow: -2px 2px 0 black, 2px 2px 0 black, 2px -2px 0 black, -2px -2px 0 black;
            pointer-events: none; /* Prevent interaction */
            transform: translate(-50%, -50%); /* Centering */
            size: auto;
        }

    </style>
</head>
<body>
    <!-- Connect page -->
    <div id="connectScreen">
        <h2>Enter Name:</h2>
        <input type="text" id="name" placeholder="Enter name" required><br>
        <h2>Connect to a Player</h2>
        <button id="hostGame">Host Game</button>
        <input type="text" id="peerIdInput" placeholder="Enter host ID">
        <button id="joinGame">Join Game</button>
        <p>Your ID: <span id="ownId"></span></p>
    </div>

    <!-- Game settings page-->
    <div id="settingsScreen" style="display: none;">
        <h2>Game Settings</h2>
        <form id="gameForm">
            <!-- <label for="numPlayers">Number of players: </label>
            <input type="number" id="numPlayers" min="1" max="4" value="1" required><br> -->
        
            <!-- <div id="playerNames"></div>  -->
        
            <label for="gameType">Game type: </label>
            <input type="text" id="gameType" placeholder="Enter game type" required><br>

            <label>Starting Troops: <input type="number" id="troopsInput" value="50" step="10"></label>

            <button type="submit" id="startGame">Start Game</button>
        </form>
        <div>
            <h2>Players Connected: <br></h2>
            <ol id="listOfNames">

            </ol>
        </div>
        <!-- I put the button here so it didn't recognise the submit in the form -->
    </div>

    <!-- Country name tag -->
    <div class="country_name"></div>

    <!-- <div class="territory_info_div">
        <button id="attackButton" className="bg-blue-500 text-white p-2 rounded-md w-16">⚔️</button>
        <button id="sailButton" className="bg-blue-500 text-white p-2 rounded-md w-16">⛵</button>
    </div> -->

    <!-- Toggleable Action Panel -->
    <div class="territory_info_div">
        <button id="attackButton">⚔️ Attack</button>
        <button id="sailButton">⛵ Sail</button>
    </div>

    <!-- Permanent Bottom HUD -->
    <div class="game_hud">
        <div class="hud-section">
            <div class="stat">
                <p id="stat-value">00</p>
                <p id="stat-label">Infantry</p>
            </div>
            <div class="stat">
                <p id="stat-value">00</p>
                <p id="stat-label">Cavalry</p>
            </div>
            <div class="stat">
                <p id="stat-value">00</p>
                <p id="stat-label">Artillery</p>
            </div>
        </div>
    </div>
    
    <!-- <div className="bg-gray-700 p-3 rounded-lg mb-2 w-full flex justify-center space-x-4">
    <button className="bg-red-500 text-white p-2 rounded-md w-16">Info</button>
    </div> -->

    <!-- <div class="territory_info_div">
        <button id='attackButton'>ATTACK</button><button id='sailButton'>SAIL</button>
    </div> -->

    <div id="troopContainer"></div>

    <!-- game page / End game -->
    <!-- <div id="gameScreen" style="display: none;">
        <button id="endGame">End Game</button>
    </div> -->

</body>
</html>
