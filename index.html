<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <h1>Game Menu</h1>
        <form id="gameForm">
          <label for="numPlayers">Number of players:</label>
          <input type="number" id="numPlayers" min="1" max="4" value="1" required><br>
      
          <div id="playerNames"></div> 
      
          <label for="gameType">Game type:</label>
          <input type="text" id="gameType" placeholder="Enter game type" required><br>
      
          <button type="submit">Start Game</button>
        </form>
    
        <style>

        </style>

    </head>
    <body>
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('gameForm');
            const numPlayersInput = document.getElementById('numPlayers');
            const playerNamesDiv = document.getElementById('playerNames');

            // dynamic form change
            function generatePlayerInputs() {
                playerNamesDiv.innerHTML = ''; //  Clear inputs
                const numPlayers = numPlayersInput.value;

                for (let i = 1; i <= numPlayers; i++) {
                const label = document.createElement('label');
                label.textContent = `Player ${i} Name: `;
                const input = document.createElement('input');
                input.type = 'text';
                input.id = `player${i}Name`;
                label.appendChild(input);
                playerNamesDiv.appendChild(label);
                playerNamesDiv.appendChild(document.createElement('br'));
            }
        }

        // Update the player name
        numPlayersInput.addEventListener('input', generatePlayerInputs);
        generatePlayerInputs(); //  generate inputs based on the default value


        form.addEventListener('submit', function (e) {
            e.preventDefault();

            console.log('form submitted');

            const numPlayers = numPlayersInput.value;
            const playerNames = [];
            for (let i = 1; i <= numPlayers; i++) {
            const playerName = document.getElementById(`player${i}Name`).value;
            playerNames.push(playerName);
            }
            const gameType = document.getElementById('gameType').value;

            // Store the data in localStorage or pass through URL
            sessionStorage.setItem('gameData', JSON.stringify({ number : numPlayers, names : playerNames, type : gameType }));

            console.log(localStorage.getItem('gameData')); 
            window.location.href = 'game.html';

            });
        });
        </script>
    </body>
</html>
