<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Game</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115.0/build/three.min.js" integrity="sha256-BKLpj/JlS+Fk4HENt+eiU5TifNz5GsSAl3KpXe80Lxc=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115.0/examples/js/controls/OrbitControls.js" integrity="sha256-uWwPr5IvLCtUCrZZdAZubHpQZ+HFhOL4ZdoLKhodld0=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js" integrity="sha256-tHoAPGoNdhIR28YHl9DWLzeRfdwigkH7OCBXMrHXhoM=" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <script src="Country.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script defer src="peerConnect.js"></script>

    <style>
        body {
            margin: 0;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        .label {
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            background-color: rgba(255, 0, 0, 0.671);
            padding: 2px;
            border-radius: 3px;
            text-align: center;
        }

        .country_name {
            position: fixed;
            bottom: 10%;
            left: 10%;
            font-size: 3.3rem;
            color: white;
            user-select: none;
            text-shadow: -1px 1px 0 #000, 1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
            font-family: 'Roboto', sans-serif;
            visibility: hidden;
        }

        .territory_info_div {
            position: fixed;
            bottom: 20%;
            left: 46.8%;
            font-size: 2rem;
            color: white;
            user-select: none;
            font-family: 'Roboto', sans-serif;
            border: solid;
            border-color: rgb(196, 2, 2);
            border-width: 5px;
            size: auto;
            display: inline-flex;
            visibility: hidden;
        }

        #troopContainer {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none; /* Prevent interaction */
            z-index: 10;
        }

        .troop-count {
            position: absolute;
            color: white;
            font-size: 15rem;
            font-weight: bold;
            text-shadow: -2px 2px 0 black, 2px 2px 0 black, 2px -2px 0 black, -2px -2px 0 black;
            pointer-events: none; /* Prevent interaction */
            transform: translate(-50%, -50%); /* Centering */
        }

    </style>
</head>
<body>
    <!-- Connect page -->
    <div id="connectScreen">
        <h2>Connect to a Player</h2>
        <button id="createHost">Host Game</button>
        <input type="text" id="peerIdInput" placeholder="Enter host ID">
        <button id="joinGame">Join Game</button>
        <p>Your ID: <span id="ownId"></span></p>
    </div>

    <!-- Game settings page-->
    <div id="settingsScreen" style="display: none;">
        <h2>Game Settings</h2>
        <form id="gameForm">
            <label for="numPlayers">Number of players: </label>
            <input type="number" id="numPlayers" min="1" max="4" value="1" required><br>
        
            <div id="playerNames"></div> 
        
            <label for="gameType">Game type: </label>
            <input type="text" id="gameType" placeholder="Enter game type" required><br>

            <label>Starting Troops: <input type="number" id="troopsInput" value="50"></label>

            <button type="submit" id="startGame">Start Game</button>
        </form>
        <!-- I put the button here so it didn't recognise the submit in the form -->
    </div>

    <!-- Main game page -->
    <div class="country_name"></div>
    <div class="territory_info_div">
        <button id='attackButton'>ATTACK</button><button id='sailButton'>SAIL</button>
    </div>

    <div id="troopContainer"></div>

    <!-- game page / End game -->
    <!-- <div id="gameScreen" style="display: none;">
        <button id="endGame">End Game</button>
    </div> -->

</body>
</html>
